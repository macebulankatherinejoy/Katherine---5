<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ESP WiFi Manager</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

    <style>

        body {

            display: flex;

            justify-content: center;

            align-items: center;

            min-height: 100vh;

            padding: 20px;

        }


        .wifi-card {

            background: white;

            width: 100%;

            max-width: 500px;

            padding: 35px;

            border-radius: 20px;

            box-shadow:
                0 10px 30px
                rgba(190,24,93,.20);

            border:
                1px solid #fbcfe8;

        }


        .wifi-card h1 {

            text-align: center;

            color: #be185d;

            margin-bottom: 10px;

        }


        .wifi-card p {

            text-align: center;

            color: #9d174d;

            margin-bottom: 25px;

        }


        .form-group {

            margin-bottom: 18px;

        }


        .form-group label {

            display: block;

            color: #831843;

            font-weight: bold;

            margin-bottom: 7px;

        }


        .form-group input {

            width: 100%;

            height: 48px;

            padding: 0 14px;

            border:
                2px solid #fbcfe8;

            border-radius: 10px;

            font-size: 15px;

            background: #fff7fb;

            color: #831843;

            outline: none;

        }


        .form-group input:focus {

            border-color: #ec4899;

            box-shadow:
                0 0 0 3px
                rgba(236,72,153,.12);

        }


        .wifi-button {

            width: 100%;

            margin-top: 10px;

            padding: 14px;

            border: none;

            border-radius: 10px;

            background:
                linear-gradient(
                    135deg,
                    #ec4899,
                    #be185d
                );

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

        }


        .wifi-button:hover {

            transform:
                translateY(-1px);

        }


        .info {

            margin-top: 20px;

            padding: 15px;

            border-radius: 12px;

            background: #fff1f7;

            color: #831843;

            font-size: 14px;

            line-height: 1.6;

        }

    </style>

</head>


<body>


<div class="wifi-card">


    <h1>
        📶 ESP WiFi Manager
    </h1>


    <p>
        Configure the WiFi connection
        for your ESP32.
    </p>


    <form
        action="/"
        method="POST"
    >


        <div class="form-group">

            <label for="ssid">
                WiFi SSID
            </label>

            <input
                type="text"
                id="ssid"
                name="ssid"
                placeholder="Enter WiFi name"
                required
            >

        </div>


        <div class="form-group">

            <label for="pass">
                WiFi Password
            </label>

            <input
                type="password"
                id="pass"
                name="pass"
                placeholder="Enter WiFi password"
                required
            >

        </div>


        <div class="form-group">

            <label for="ip">
                IP Address
            </label>

            <input
                type="text"
                id="ip"
                name="ip"
                placeholder="Optional - leave blank for DHCP"
            >

        </div>


        <div class="form-group">

            <label for="gateway">
                Gateway Address
            </label>

            <input
                type="text"
                id="gateway"
                name="gateway"
                placeholder="Optional - leave blank for DHCP"
            >

        </div>


        <button
            type="submit"
            class="wifi-button"
        >
            Save & Connect
        </button>


    </form>


    <div class="info">

        <strong>How it works:</strong>

        <br>

        1. Enter the WiFi SSID and password.

        <br>

        2. Click Save & Connect.

        <br>

        3. ESP32 saves the settings.

        <br>

        4. ESP32 restarts.

        <br>

        5. ESP32 connects to your WiFi.

        <br>

        6. Open the ESP32 IP address
        to access the main web server.

    </div>


</div>


</body>

</html>
